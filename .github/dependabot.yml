# Akce jsou připnuté na commit SHA (uses: ...@<sha> # verze), protože značku
# jde přepsat a SHA ne. Připnutá akce ale sama nezestárne: bez tohohle souboru
# by v ní zamrzla i bezpečnostní oprava a nikdo by si toho nevšiml.
#
# Všechno v jednom PR, jednou měsíčně. Bez `groups` zakládá Dependabot větev
# na každou akci zvlášť — 26. 8. 2026 jich takhle naráz přibylo pět a v seznamu
# větví z toho byl nepořádek. Seskupené je to jedna větev, ať jich čeká kolik chce.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # Onto `dev`, because that is where work goes. Without this, Dependabot
    # opens against the default branch — `main` — which is the published branch
    # and the one nobody commits to. PR #214 sat there for four days for that
    # reason, and by the time it was read, half of it bumped steps `dev` had
    # already deleted.
    #
    # The cost, stated so it is not discovered later: with `target-branch` set,
    # GitHub raises security updates only against the default branch, so an
    # advisory on an action will not arrive on its own. The monthly run picks it
    # up within the month, which for four pinned GitHub actions is the trade
    # worth making.
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
