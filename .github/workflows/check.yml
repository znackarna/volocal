# Everything the working agreement in CLAUDE.md asks for before a change is
# finished, run on every push.
#
# Why two platforms and not one. Ubuntu is the cheap pass — TypeScript, the
# dictionaries, formatting, and a Rust check of everything that is not
# platform-specific. It is not enough on its own: `#[cfg(windows)]` is removed
# after parsing, so code behind it is never type-checked on Linux. The job
# object in `main.rs` and `set_webview2` in `tools.rs` are exactly that kind of
# code, and the first thing to read them today is a build on somebody's desk.
# The Windows job compiles them.
#
# The installer is deliberately not built on every push — see `installer` below.
name: Checks

on:
  push:
    branches: [main]
    # A release is a tag. The two checking jobs run for it as well, so nothing
    # is tagged that has not been checked.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      installer:
        description: "Also build the installer (NSIS, ~20 minutes)"
        type: boolean
        default: false

jobs:
  frontend:
    name: TypeScript and dictionaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The whole chain, in one command, because it is the same one the local
      # checklist runs: `i18n:check`, then `tsc --noEmit`, then the real Vite
      # build. Type checking alone would let a build failure through — a bad
      # import or an asset that cannot be resolved type-checks fine.
      #
      # `i18n:check` is the unusual step: text written inside a component, a
      # missing plural form, a Rust code with no dictionary entry, informal
      # address, and a translation whose Czech source has been reworded since.
      - run: npm run build
      # The frontend had no automatic protection at all until 10 August, which
      # is one reason the regressions it did have — keys, dialogs, the
      # collapsing header, player state — were all in the interface.
      - run: npm run test

  # There was a second Rust job on Ubuntu until 2026-08-07. It was the cheap
  # fast pass: a minute against Windows' three, and Windows minutes are billed
  # double on a private repository. It stopped earning that.
  #
  # Volocal ships on Windows and nowhere else — whisper-cli.exe, DirectML, NSIS,
  # `%LOCALAPPDATA%\Whisp`. So Linux could not find anything Windows would miss;
  # it could only fail for reasons nobody here would ever hit, on a different
  # ONNX Runtime build and a different set of system libraries it first had to
  # apt-get. And once `ort` arrived it was not fast either, because it downloads
  # ONNX Runtime like everybody else.
  #
  # `cargo fmt` moved here rather than being dropped: formatting is
  # platform-independent, but it has to run somewhere, and this is the only
  # place left that has a Rust toolchain.
  windows:
    name: Rust on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows
      # First, because it is three seconds and it fails often enough to be worth
      # failing early.
      - run: cargo fmt --all --check
      # Clippy rather than `cargo check`: it compiles everything `check` would,
      # so nothing is lost, and it also refuses the lints. The 21 findings this
      # replaced were fixed on 10 August; without this step they would come
      # back one at a time and nobody would notice until the next audit.
      #
      # `--all-targets` also compiles the test binaries, so a `#[cfg(windows)]`
      # block used only by a test is checked too.
      #
      # Warnings are errors: a warning nobody has to look at is a warning
      # nobody reads. A narrow `#[allow]` with a comment saying why is the way
      # to make an exception — never a blanket one.
      - run: cargo clippy --all-targets -- -D warnings
      # And run them. The tests worth the extra minutes are the ones about
      # process lifetime — killing a child, closing the window while a program
      # runs — which is behaviour the operating system decides, not the code.
      - run: cargo test

  installer:
    name: Installer (NSIS)
    # Only when asked for, or for a tag. `npm run tauri build` links the release
    # profile with LTO and then runs NSIS; that is twenty minutes and change,
    # billed at the Windows rate, and nothing about it is worth paying on every
    # push when `cargo check` above already says whether the code compiles.
    if: github.ref_type == 'tag' || inputs.installer
    needs: [frontend, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: windows-release
      - run: npm ci
      # The stricter half of the dictionary check, and the only place it runs.
      #
      # `i18n:check` treats a translation whose Czech source has never been
      # fingerprinted as a warning, which is right while a change is in
      # progress — the fingerprint is recorded once somebody has actually
      # compared the two. But that fingerprint is the only thing `drifted` can
      # later compare against, so a key without one can never be caught by a
      # reworded source. Handing that to somebody is different from carrying it
      # for an afternoon, and this is where the difference is enforced.
      #
      # Tags only. Asking for an installer by hand is usually a test of the
      # bundling, not a release, and failing that on dictionary bookkeeping
      # would only teach people to stop asking.
      - name: Dictionary, release rules
        if: github.ref_type == 'tag'
        run: node scripts/i18n.mjs check --strict
      # `beforeBuildCommand` in tauri.conf.json is `npm run build`, i.e.
      # `i18n:check && tsc --noEmit && vite build`. The bundler runs it itself;
      # it is not repeated here.
      #
      # Unsigned, twice over, and both are deliberate.
      #
      # The Authenticode certificate lives on a hardware token and cannot be
      # handed to a runner. And `tauri.ci.conf.json` turns off the updater
      # artifact, because with a public key in the config the bundler demands
      # the matching private key — *A public key has been found, but no private
      # key* — and that key must not be on a runner either. Handing either of
      # them to CI would mean anybody who can push a workflow can sign a release
      # this application accepts.
      #
      # So what comes out of here is a build proving the code bundles and the
      # result runs. A release anybody installs is built and signed by hand;
      # `scripts\release.ps1` is that path, and „Vydání" in README.cs.md
      # describes it.
      - run: ./node_modules/.bin/tauri build --config src-tauri/tauri.ci.conf.json
      # Install it and start it. Everything above says the code compiles and
      # bundles; none of it says the result runs. What this catches is exactly
      # the class of failure that only appears once the pieces are assembled —
      # a resource left out of the bundle, a missing WebView2, a panic in
      # `setup` before a window ever appears — and every one of those looks
      # like a perfectly green build right up until somebody double-clicks.
      #
      # The archive file is the signal, not the window: `whisp.db` is created
      # by the Rust side during startup, after the settings are read and the
      # migrations have run. If it appears, the application got past the part
      # that can fail on a machine that is not this one.
      - name: Smoke test of the installed copy
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1
          Write-Host "installing $($installer.Name)"
          # /S is NSIS's silent install; the bundle is a currentUser install,
          # so it needs no elevation and lands under %LOCALAPPDATA%.
          Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA" -Filter Volocal.exe -Recurse `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "the installer did not leave a Volocal.exe behind" }
          Write-Host "installed to $($exe.FullName)"

          # Asserted rather than deleted. On a fresh runner this file cannot
          # exist, and if it somehow did, an old one would make the whole test
          # pass without the application having done anything.
          $archive = "$env:APPDATA\cz.znackarna.volocal\whisp.db"
          if (Test-Path $archive) { throw "an archive was already here; this runner is not clean" }
          $app = Start-Process -FilePath $exe.FullName -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while (-not (Test-Path $archive) -and (Get-Date) -lt $deadline) {
            if ($app.HasExited) { throw "it exited on its own with code $($app.ExitCode)" }
            Start-Sleep -Seconds 2
          }
          $log = "$env:APPDATA\cz.znackarna.volocal\volocal-log.txt"
          if (Test-Path $log) { Write-Host "--- volocal-log.txt ---"; Get-Content $log }
          if (-not (Test-Path $archive)) {
            throw "it started but never got as far as creating its archive"
          }
          Write-Host "archive created, $((Get-Item $archive).Length) bytes - it runs"
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: volocal-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
