# The presentation page, published to volocal.app.
#
# The page is static and has no build step: `docs/site/` is what gets served,
# minus the three files that are tools rather than the page.
#
# It went to GitHub Pages as well until 27 August 2026, for the three days it
# took to be sure of Vercel. Pages was switched off at the owner's word once
# the page had its own address and both copies agreed about which one it was.
# The steps that fed it are gone rather than disabled -- a deploy nobody
# watches is worse than no deploy, and `actions/deploy-pages` against a Pages
# site that no longer exists would have failed the whole job and taken the
# Vercel step with it.
#
# It lived on a branch of its own for three days, because a half-finished
# paragraph in the working tree makes `release.ps1` refuse to publish. That is
# the release script's rule, not a reason to split a repository: the page came
# back on 2026-08-24, and the discipline is to commit page work like any other.
#
# One thing is rewritten on the way out: the version in the hero. The file
# carries a real number so that opening it locally never shows a placeholder,
# and this replaces it with the version a reader can actually download, which
# is the latest release and not whatever `tauri.conf.json` said when this
# branch last took from main.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - '.github/workflows/site.yml'
  # A release changes the page without touching a file in it: the version in
  # the hero and the closing is read from the latest release below, so a page
  # deployed before the release keeps offering the version before it. On
  # 26 August 2026 the site said 1.2.20 for the hours between publishing 1.2.21
  # and the next edit to `docs/site/`, and the only thing wrong was that nobody
  # had pushed anything.
  release:
    types: [published]
  workflow_dispatch:

# `contents: read` is all that is left. `pages: write` and `id-token: write`
# were what Pages needed to be handed an artefact and to prove who was handing
# it over; Vercel is authenticated by a token in the secrets instead.
permissions:
  contents: read

# One deployment at a time, and a newer push wins: two pushes a minute apart
# would otherwise race to publish and the older one could land last.
concurrency:
  group: site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Collect the page
        run: |
          mkdir -p _site
          cp docs/site/index.html _site/
          cp docs/site/brand.css docs/site/app-shot.css docs/site/page.css _site/
          cp docs/site/brand.js docs/site/chibi.js docs/site/preview.js _site/
          cp docs/site/og.png docs/site/og-en.png _site/
          cp docs/site/robots.txt docs/site/sitemap.xml _site/
          cp -r docs/site/fonts _site/fonts
          # `_tokens.html`, `bundle.py`, `scope-app-css.py`, `translate.mjs` and
          # `en.json` stay behind: they are how the page is worked on and how the
          # English one is made, not part of what is served.
          #
          # `.nojekyll` went with Pages. It told Pages not to run the page
          # through Jekyll first; it meant nothing anywhere else.

      # The English page is the Czech one with its sentences swapped, so it is
      # made here rather than kept in the repository -- one page to edit, two to
      # read. It lands a directory deeper and looks one level up for the
      # stylesheet, the scripts and the fonts, which is why nothing is copied
      # into `en/`.
      - name: Write the English page
        run: node docs/site/translate.mjs _site/en/index.html

      - name: Name the version that can be downloaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName | sed 's/^v//')"
          echo "Latest release: $version"
          VERSION="$version" python - <<'PY'
          import os, re, pathlib
          version = os.environ["VERSION"]
          # Two of them in each page -- the hero and the closing. The count is
          # asserted rather than assumed: if either sentence is ever reworded,
          # this build fails loudly instead of quietly shipping last month's
          # number. The English page says it in English, and its own count is
          # checked separately so a half-translated page cannot pass.
          pages = {
              "_site/index.html": r"Verze \d+\.\d+\.\d+",
              "_site/en/index.html": r"Version \d+\.\d+\.\d+",
          }
          for path, pattern in pages.items():
              page = pathlib.Path(path)
              text = page.read_text(encoding="utf-8")
              word = pattern.split(" ")[0]
              text, found = re.subn(pattern, word + " " + version, text)
              if found != 2:
                  raise SystemExit("%s: expected 2 version mentions, found %d" % (path, found))
              page.write_text(text, encoding="utf-8")
          PY

      # Vercel, which is what answers on volocal.app. It stood last in the job
      # while Pages was still serving readers, so that a Vercel problem could
      # not hold up the deploy that was already working. It is the deploy now.
      #
      # `--prod` on every run because this project has no branch to infer from:
      # nothing connects it to git, the artefact arrives already built, and the
      # workflow's own triggers are what decide when it goes out.
      #
      # The version is pinned for the reason `components.json` gives at length:
      # a build that fetches "latest" is a build nobody can reproduce. 59.5.0
      # is what this step was written and verified against.
      #
      # One thing that reads as a fault and is not: opening the
      # `volocal-*.vercel.app` address asks for a Vercel login. Deployment
      # protection on this team is `all_except_custom_domains`, so the
      # deployment URLs are private and volocal.app is public -- which is the
      # way round it should be.
      - name: Publish to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@59.5.0 deploy _site --prod --yes --token="$VERCEL_TOKEN"
