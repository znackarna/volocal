[package]
name = "volocal"
version = "1.2.25"
description = "Volocal turns speech into text, on your own machine"
authors = ["značkárna s.r.o."]
edition = "2021"
# Raised from 1.77 by `ort`, which is edition 2024 and declares 1.88 itself.
# Declaring less than a dependency needs is a promise the build cannot keep.
rust-version = "1.88"
# Not a crate anybody publishes; the guard is here so nobody does by accident.
publish = false

# Windows only, and pinned to exactly what wry 0.55 already links: two copies of
# these COM bindings in one binary would be two unrelated types with one name.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
# The same rule, same reason: 0.61.3 is the version already in the tree, so
# this adds four feature flags and no second copy of the Win32 bindings.
# Only what the job object needs, and each flag is here for its own reason:
# Win32_System_JobObjects carries all three calls and the limit struct;
# Win32_Security carries the SECURITY_ATTRIBUTES in CreateJobObjectW's
# signature, which is passed as None; Win32_System_Threading carries
# GetCurrentProcess; Win32_Foundation carries the HANDLE they trade in.
# Win32_System_SystemInformation carries GlobalMemoryStatusEx and MEMORYSTATUSEX,
# which is how `tools::total_memory_gb` reads how much memory this computer has —
# the one fact the first-run question needs and had no way to ask for.
# Three more for the window's own icon, which the title bar was stretching from
# 16 px: Win32_UI_WindowsAndMessaging carries LoadImageW, SendMessageW and the
# metrics constants; Win32_UI_HiDpi carries GetDpiForWindow, which is what makes
# the metric this screen's rather than a nominal 96 dpi one; and
# Win32_System_LibraryLoader carries GetModuleHandleW, which names the module
# the icon resource lives in.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# The graphics card, and the reason it is only asked for here. ONNX Runtime has
# no Vulkan provider and never has, so the AMD route is DirectML — which exists
# on Windows and nowhere else. `ort` merges this with the plain dependency
# below, so Linux still builds; it simply has no `ort::ep::DirectML` to name.
#
# Measured on the machine this was written for: 8.9x faster than the processor
# at a batch of 256, and 1.5x at a batch of one. It is worth having only because
# the work arrives in batches.
ort = { version = "=2.0.0-rc.13", features = ["directml"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# stahovani nastroju a modelu primo z aplikace
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = "2"
# SHA-256 of every downloaded component, checked before anything is unpacked or
# moved into place. Both versions are already resolved in Cargo.lock through
# other dependencies, so naming them here adds no new code to the build.
sha2 = "0.10"
hex = "0.4"
# Speaker embedding, in this process instead of a downloaded executable.
# Pinned with `=` on purpose: `ort` is in release candidates and the API breaks
# between them — between rc.9 and rc.13 nearly every call this uses was renamed.
# `download-binaries` is a default feature, so ONNX Runtime arrives on its own;
# on Windows there is no plain build in its distribution table, so the one it
# fetches is the DirectML build.
ort = "=2.0.0-rc.13"
tauri-plugin-updater = "2.10.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
