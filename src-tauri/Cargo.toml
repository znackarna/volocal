[package]
name = "slobot"
version = "0.9.0"
description = "Slobot turns speech into text, on your own machine"
authors = ["značkárna s.r.o."]
edition = "2021"
rust-version = "1.77"
# Not a crate anybody publishes; the guard is here so nobody does by accident.
publish = false

# Windows only, and pinned to exactly what wry 0.55 already links: two copies of
# these COM bindings in one binary would be two unrelated types with one name.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38.2"
# The same rule, same reason: 0.61.3 is the version already in the tree, so
# this adds four feature flags and no second copy of the Win32 bindings.
# Only what the job object needs, and each flag is here for its own reason:
# Win32_System_JobObjects carries all three calls and the limit struct;
# Win32_Security carries the SECURITY_ATTRIBUTES in CreateJobObjectW's
# signature, which is passed as None; Win32_System_Threading carries
# GetCurrentProcess; Win32_Foundation carries the HANDLE they trade in.
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
anyhow = "1"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# stahovani nastroju a modelu primo z aplikace
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
